<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мобильный калькулятор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Мобильная адаптация */
        * {
            box-sizing: border-box;
            touch-action: manipulation; /* Отключает масштабирование при двойном тапе */
        }

        body {
            margin: 0;
            padding: 10px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #calculator {
            width: 100%;
            max-width: 500px; /* Максимальная ширина для планшетов */
            margin: 0 auto;
        }

        #display {
            width: 100%;
            height: 15vh;
            min-height: 80px;
            margin-bottom: 2vh;
            font-size: 8vw;
            text-align: right;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5vw;
        }

        button {
            padding: 4vh 0;
            font-size: 5vw;
            border: none;
            border-radius: 12px;
            background: #fff;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
            background: #e0e0e0;
        }

        button.operator {
            background: #f0f2f5;
        }

        button.equals {
            background: #007bff;
            color: white;
        }

        /* Адаптация для очень маленьких экранов */
        @media (max-width: 350px) {
            #display {
                font-size: 10vw;
                height: 12vh;
            }
            button {
                padding: 3vh 0;
                font-size: 6vw;
            }
        }

        /* Ландшафтная ориентация */
        @media (orientation: landscape) {
            body {
                justify-content: flex-start;
                padding-top: 5vh;
            }
            #calculator {
                max-width: 90vh;
            }
            #display {
                height: 10vh;
                font-size: 6vw;
            }
        }
    </style>
</head>
<body>
    <!-- Тело калькулятора без изменений -->
    <div id="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <!-- Кнопки как в предыдущей версии -->
        </div>
    </div>

    <script>
        /* JavaScript остается без изменений */
    </script>
</body>
</html>
